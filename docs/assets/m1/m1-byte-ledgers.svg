<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 675" role="img" aria-labelledby="atlas-title atlas-description">
<title id="atlas-title">M1 byte ledgers</title>
<desc id="atlas-description">Exact byte-ledger comparison plus a clearly not-to-scale unattributed-difference inset.</desc>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#0b1220"/>
<text x="60" y="62" fill="#dbeafe" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="start">M1 byte ledgers</text>
<text x="60" y="94" fill="#94a3b8" font-family="sans-serif" font-size="17" font-weight="400" text-anchor="start">Separate API-reported artifact bytes from index-declared tensor payload bytes.</text>
<line x1="60" y1="114" x2="1140" y2="114" stroke="#152238" stroke-width="2"/>
<text x="60" y="165" fill="#dbeafe" font-family="sans-serif" font-size="20" font-weight="400" text-anchor="start">API weight-shard bytes</text>
<rect x="60" y="185" width="900" height="34" rx="6" fill="#152238"/>
<rect x="60" y="185" width="900" height="34" rx="6" fill="#60a5fa"/>
<text x="990" y="212" fill="#60a5fa" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="start">166,886,535,336</text>
<text x="60" y="270" fill="#dbeafe" font-family="sans-serif" font-size="20" font-weight="400" text-anchor="start">Index-declared tensor payload</text>
<rect x="60" y="290" width="900" height="34" rx="6" fill="#152238"/>
<rect x="60" y="290" width="900" height="34" rx="6" fill="#34d399"/>
<text x="990" y="317" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="start">166,878,536,440</text>
<rect x="60" y="385" width="1080" height="120" rx="12" fill="#152238" stroke="#fbbf24" stroke-width="2"/>
<text x="85" y="423" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="start">Explicit inset — NOT TO SCALE</text>
<text x="85" y="462" fill="#fbbf24" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="start">Unattributed difference: 7,998,896 bytes</text>
<text x="570" y="423" fill="#dbeafe" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="start">API non-weight files: 12,125,738 bytes</text>
<text x="570" y="462" fill="#dbeafe" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="start">API all repository files: 166,898,661,074 bytes</text>
<text x="60" y="565" fill="#dbeafe" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="start">Difference = API weight-shard bytes − index-declared tensor payload bytes.</text>
<text x="60" y="602" fill="#f87171" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="start">Not measured compression and not proven container overhead.</text>
<text x="60" y="635" fill="#94a3b8" font-family="sans-serif" font-size="17" font-weight="400" text-anchor="start">No artifact payload was inspected.</text>
</svg>
