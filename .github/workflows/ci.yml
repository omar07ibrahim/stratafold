name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-free-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resource preflight
        run: make doctor
      - name: Unit and repository policy tests
        run: make test
      - name: Verify adopted M1 evidence
        run: make evidence-m1-verify
      - name: Patch hygiene
        run: git diff --check
      - name: Require clean checkout before evidence capture
        run: |
          git diff --exit-code -- .
          test -z "$(git status --short --untracked-files=all)"
      - name: Generate and replay M1 evidence
        run: |
          make M1_EVIDENCE_DIR="$RUNNER_TEMP/m1-evidence" evidence-m1
          make M1_EVIDENCE_DIR="$RUNNER_TEMP/m1-evidence" evidence-m1-check
      - name: Verify exact M1 artifact inventory
        run: |
          actual="$(
            find "$RUNNER_TEMP/m1-evidence" \
              -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
              | LC_ALL=C sort
          )"
          expected="$(
            printf '%s\n' \
              m1_target_genome.json \
              m1_target_genome.txt
          )"
          test "$actual" = "$expected"
          test -z "$(
            find "$RUNNER_TEMP/m1-evidence" \
              -mindepth 1 -maxdepth 1 ! -type f -print -quit
          )"
      - name: Compare regenerated M1 evidence with committed evidence
        run: |
          cmp -- \
            "$RUNNER_TEMP/m1-evidence/m1_target_genome.json" \
            evidence/raw/m1_target_genome.json
          cmp -- \
            "$RUNNER_TEMP/m1-evidence/m1_target_genome.txt" \
            evidence/raw/m1_target_genome.txt
      - name: Require clean checkout after evidence verification
        run: |
          git diff --exit-code -- .
          test -z "$(git status --short --untracked-files=all)"
      - name: Upload reviewed M1 evidence surfaces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-target-genome-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m1-evidence/m1_target_genome.json
            ${{ runner.temp }}/m1-evidence/m1_target_genome.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false


  m1-visual-atlas:
    needs: dependency-free-control-plane
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact visual Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.3
      - name: Verify exact Python runtime
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.3"
          test "$(python -c 'import platform; print(platform.python_implementation())')" = "CPython"
      - name: Fetch the exact hash-locked Pillow wheel
        run: |
          mkdir "$RUNNER_TEMP/m1-visual-wheels"
          python -m pip download \
            --dest "$RUNNER_TEMP/m1-visual-wheels" \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r requirements/visuals.txt
          expected="pillow-12.3.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"
          actual="$(
            find "$RUNNER_TEMP/m1-visual-wheels" \
              -mindepth 1 -maxdepth 1 -type f -printf '%f\n'
          )"
          test "$actual" = "$expected"
          test -z "$(
            find "$RUNNER_TEMP/m1-visual-wheels" \
              -mindepth 1 -maxdepth 1 ! -type f -print -quit
          )"
          printf '%s  %s\n' \
            "78cb2c6865a35ab8ff8b75fd122f6033b92a62c82801110e48ddd6c936a45d91" \
            "$RUNNER_TEMP/m1-visual-wheels/$expected" \
            | sha256sum --check --strict -
      - name: Install only the verified visual dependency
        run: |
          python -m pip install \
            --no-index \
            --no-deps \
            --find-links "$RUNNER_TEMP/m1-visual-wheels" \
            --only-binary=:all: \
            --require-hashes \
            -r requirements/visuals.txt
          python - <<'PY'
          import PIL
          from PIL import ImageFont
          assert PIL.__version__ == "12.3.0"
          font = ImageFont.load_default(size=14)
          assert font.getname() == ("Aileron", "Regular")
          PY
      - name: Run exact visual contract tests
        run: make PYTHON=python visuals-m1-test
      - name: Render the atlas twice from committed sources
        run: |
          mkdir "$RUNNER_TEMP/m1-atlas-first"
          mkdir "$RUNNER_TEMP/m1-atlas-second"
          make PYTHON=python M1_VISUAL_DIR="$RUNNER_TEMP/m1-atlas-first" visuals-m1
          make PYTHON=python M1_VISUAL_DIR="$RUNNER_TEMP/m1-atlas-second" visuals-m1
      - name: Verify both exact 11-file inventories
        run: |
          expected="$(
            printf '%s\n' \
              atlas.manifest.json \
              m1-architecture.svg \
              m1-byte-ledgers.svg \
              m1-cli-inspect.png \
              m1-drift-boundary.svg \
              m1-expert-census.svg \
              m1-parameter-classes.svg \
              m1-rejection-path.gif \
              m1-shard-inventory.svg \
              m1-topology.svg \
              m1_rejection_path.json
          )"
          for directory in \
            "$RUNNER_TEMP/m1-atlas-first" \
            "$RUNNER_TEMP/m1-atlas-second"
          do
            actual="$(
              find "$directory" \
                -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
                | LC_ALL=C sort
            )"
            test "$actual" = "$expected"
            test -z "$(
              find "$directory" \
                -mindepth 1 -maxdepth 1 ! -type f -print -quit
            )"
          done
      - name: Require byte-identical atlas replay
        run: |
          for name in \
            m1_rejection_path.json \
            atlas.manifest.json \
            m1-cli-inspect.png \
            m1-architecture.svg \
            m1-topology.svg \
            m1-expert-census.svg \
            m1-shard-inventory.svg \
            m1-byte-ledgers.svg \
            m1-parameter-classes.svg \
            m1-drift-boundary.svg \
            m1-rejection-path.gif
          do
            cmp -- \
              "$RUNNER_TEMP/m1-atlas-first/$name" \
              "$RUNNER_TEMP/m1-atlas-second/$name"
          done
      - name: Require clean checkout after hosted rendering
        run: |
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --short --untracked-files=all)"
      - name: Upload unadopted M1 visual atlas for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-visual-atlas-${{ github.run_id }}
          path: ${{ runner.temp }}/m1-atlas-first/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
